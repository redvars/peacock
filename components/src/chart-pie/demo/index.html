<!doctype html>
<html lang='en-GB'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover' />
  <link rel='stylesheet' href='/dist/assets/styles.css' />
  <style>
    body {
      background: var(--color-surface);
      max-width: 480px;
      margin: 2rem auto;
    }
  </style>
</head>
<body>

<wc-button id='randomize'>Randomize</wc-button>

<wc-chart-pie label='Visitors by browser' show-labels></wc-chart-pie>

<script>
  const chart = document.querySelector('wc-chart-pie');
  chart.data = [
    { name: 'chrome', label: 'Chrome', value: 275 },
    { name: 'safari', label: 'Safari', value: 200 },
    { name: 'firefox', label: 'Firefox', value: 187 },
    { name: 'edge', label: 'Edge', value: 173 },
    { name: 'other', label: 'Other', value: 90 },
  ];

  document.querySelector('#randomize').addEventListener('click', () => {
    chart.data = chart.data.map(d => ({ ...d, value: Math.round(Math.random() * 300) + 20 }));
  });
</script>

<script type='module'>
  import { Button } from '/dist/button.js';
  import { ChartPie } from '/dist/chart-pie.js';
  window.customElements.define('wc-chart-pie', ChartPie);
  window.customElements.define('wc-button', Button);
</script>
</body>
</html>
